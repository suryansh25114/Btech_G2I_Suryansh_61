<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE-WATER-GUN Game</title>
    <link rel="stylesheet" href="snake_water_gun.css">
</head>
<body>
    <!-- Heading -->

    <h1>SNAKE WATER GUN</h1>

    <!-- Options -->

    <div class="container">
        <div class="button" id="snake">
            <p>SNAKE</p>
        </div>
        <div class="button" id="water">
            <p>WATER</p>
        </div>
        <div class="button" id="gun">
            <p>GUN</p>
        </div>
    </div>

    <!-- Showing Score Board -->

    <div class="score-board">
        <div class="userScore">
            <p id="userInitialScore">0</p>
            <p>YOU</p>
        </div>
        <div class="computerScore">
            <p id="computerInitialScore">0</p>
            <p>COMPUTER</p>
        </div>
    </div>

    <!-- Displaying Result -->

    <div class="msg-container">
        <div >
            <p id="msg">SELECT YOUR CHOICE</p>
        </div>
    </div>
    <script src="snake_water_gun.js"></script>
</body>
</html>
