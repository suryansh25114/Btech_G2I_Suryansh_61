<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK-PAPER-SCISSOR GAME</title>
    <link rel="stylesheet" href="rock_paper_scissor.css">
</head>
<body>
    <h1>ROCK PAPER SCISSOR</h1>
    <div class="container">
        <div class="select" id="rock">
            <img src="rock2.jpeg">
        </div>
        <div class="select" id="paper">
            <img src="paper2.jpeg">
        </div>
        <div class="select" id="scissor">
            <img src="scissor2.jpeg">
        </div>
    </div>

    <div class="score-board">
        <div class="Choice">
            <p id="user-choice">0</p>
            <p>YOU</p>
        </div>
        <div class="Choice">
            <p id="computer-choice">0</p>
            <p>COMPUTER</p>
        </div>
    </div>

    <div class="msg-container">
        <div id="msg">SELECT YOUR CHOICE</div>
    </div>
    <script src="rock_paper_scissor.js"></script>
</body>
</html>
